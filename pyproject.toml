[project]
name = "hyper-monitor"
version = "1.0.0"
description = "Real-time leverage surveillance & risk alerts for Hyperliquid perpetual futures"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
keywords = ["hyperliquid", "trading", "monitor", "leverage", "defi", "perpetuals"]
dependencies = [
    "plyer>=2.1.0",
    "pync>=2.0.3",
    "requests>=2.33.1",
    "rich>=14.3.3",
    "schedule>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/hyper-sentinel/hyper-monitor"
Issues = "https://github.com/hyper-sentinel/hyper-monitor/issues"
